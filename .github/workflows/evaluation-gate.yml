name: Evaluation Gate

# Run the completed gate for code changes and manual checks
on:
  push:
  pull_request:
  workflow_dispatch:

# Keep repository access read-only except for issue creation.
permissions:
  contents: read
  issues: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # Run deterministic and stubbed model-assisted evaluations
      - name: Run evaluations
        run: python -m unittest -v evals.test_tier_a evals.test_tier_b
      # Test the failure handoff only for an explicit push marker.
      - name: Simulate an evaluation failure
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[simulate-eval-failure]') }}
        run: exit 1
      # Turn a failed gate into a tracked work item.
      - name: Open an issue for a failed evaluation gate
        if: ${{ failure() }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Evaluation gate failed" \
            --body "Commit $GITHUB_SHA failed the evaluation workflow. Review the failed run before merging."
        env:
          # Authenticate GitHub CLI without a personal token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
