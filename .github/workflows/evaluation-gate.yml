name: Evaluation Gate

# Manual only while the starter evaluations are intentionally failing.
# TODO: Add push and pull_request triggers when the implementation is complete.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # Evaluations use frozen fixtures and a stub provider, so no Gemini secret is needed.
      # TODO: Add evals.test_tier_b to the evaluation command.
      - name: Run evaluations
        run: python -m unittest -v evals.test_tier_a evals.test_tier_b
